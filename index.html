<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>혁성에게 물어보세요</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;min-height:100%;background:#101014;color:#eee;font-family:"Noto Sans KR","Malgun Gothic",sans-serif}
.screen{width:100%;min-height:100vh;display:none;padding:55px}.screen.active{display:flex}
#askScreen,#passwordScreen,#manageScreen{justify-content:center;align-items:center}
.container,.manageContainer,.passwordContainer{position:relative;background:#17171c;border:1px solid #303039;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.container{width:88%;max-width:1150px;min-height:78vh;padding:65px 80px;display:flex;flex-direction:column;justify-content:center;align-items:center}
.container:before,.manageContainer:before,.passwordContainer:before{content:"";position:absolute;top:-1px;left:0;width:100%;height:3px;background:#7764a8}
.topButtons{position:absolute;top:22px;right:25px;display:flex;gap:10px}button{cursor:pointer}.topButton,.editButton,.deleteButton,.backButton{background:#202027;color:#aaaab4;border:1px solid #383841;padding:9px 14px;font-size:12px}.title{font-size:clamp(30px,4vw,50px);font-weight:700;letter-spacing:-2px;margin-bottom:12px;text-align:center}.subtitle{color:#888891;font-size:16px;letter-spacing:4px;margin-bottom:55px;text-align:center}
.resultBox{position:relative;width:100%;min-height:190px;background:#121216;border:1px solid #34343d;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:35px;overflow:hidden;margin-bottom:30px}.label{font-size:11px;letter-spacing:4px;color:#75688b;margin-bottom:20px}#result{font-size:clamp(18px,2.2vw,27px);font-weight:500;text-align:center;line-height:1.7;min-height:45px;display:flex;align-items:center;justify-content:center}#result.waiting{color:#888892;animation:pulse 1.2s infinite}#result.revealed{animation:reveal .8s ease}@keyframes pulse{50%{opacity:.35}}@keyframes reveal{from{opacity:0;transform:translateY(8px);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
.askButton,.addButton,.passwordButton{padding:15px 25px;background:#292333;color:#eee;border:1px solid #55476d;font-size:14px}.askButton{width:260px}.askButton:disabled{opacity:.55;cursor:not-allowed}#statusMessage{height:20px;margin-top:18px;color:#777780;font-size:12px;letter-spacing:1px;opacity:0}#statusMessage.active{opacity:1}.count{margin-top:25px;color:#606069;font-size:12px}
.timeControl{width:100%;max-width:500px;margin-top:25px;text-align:center;color:#777780;font-size:12px}.timeControl label{display:block;margin-bottom:12px;letter-spacing:1px}#timeSlider{width:100%;accent-color:#7764a8;cursor:pointer}#timeValue{color:#aaa0c0;font-weight:600}.timeDescription{margin-top:10px;font-size:11px;color:#5f5f69;line-height:1.7}
.manageContainer{width:90%;max-width:1100px;min-height:80vh;padding:50px}.manageTitle{font-size:30px;font-weight:700;margin-bottom:10px}.manageDescription,.passwordDescription{color:#777780;font-size:13px;line-height:1.7}.manageDescription{margin-bottom:35px}.addArea{display:flex;gap:10px;margin-bottom:35px}input,textarea{background:#111116;color:#eee;border:1px solid #383841;padding:15px;font-size:14px;outline:none}#newTruth{flex:1}.truthList{max-height:48vh;overflow-y:auto;border-top:1px solid #303039}.truthItem{display:flex;align-items:center;gap:15px;padding:15px 5px;border-bottom:1px solid #292930}.truthNumber{width:35px;color:#625b6d;font-size:12px}.truthText{flex:1;color:#d7d7dc;font-size:14px;line-height:1.5}.deleteButton:hover{background:#30252b}.backButton{margin-top:30px}.passwordContainer{width:90%;max-width:500px;min-height:430px;padding:55px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.passwordIcon{font-size:35px;margin-bottom:20px;opacity:.7}.passwordTitle{font-size:25px;font-weight:700;margin-bottom:10px}#developerPassword{width:100%;text-align:center;letter-spacing:2px;margin:20px 0 12px}.passwordButton{width:100%}.passwordError{height:20px;margin-top:12px;color:#b37b86;font-size:12px;opacity:0}.passwordError.active{opacity:1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;justify-content:center;align-items:center;z-index:1000}.modal.active{display:flex}.modalContent{width:90%;max-width:550px;background:#19191f;border:1px solid #3a3a43;padding:35px}#editInput{width:100%;min-height:120px;resize:vertical}.modalButtons{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.modalButtons button{padding:10px 18px;background:#222229;color:#ddd;border:1px solid #3c3c45}.modalButtons .save{background:#292333;border-color:#55476d}
@media(max-width:700px){.screen{padding:20px}.container{width:100%;min-height:90vh;padding:55px 25px 40px}.topButtons{top:15px;right:15px}.topButton{padding:7px 9px;font-size:10px}.subtitle{margin-bottom:35px;font-size:13px}.resultBox{min-height:180px;padding:25px 15px}.askButton{width:100%}.manageContainer,.passwordContainer{width:100%;padding:35px 20px}.addArea{flex-direction:column}.addButton{height:45px}.truthItem{flex-wrap:wrap}.truthText{min-width:calc(100% - 40px)}}
</style>
</head>
<body>
<section id="askScreen" class="screen active"><div class="container" id="mainContainer">
<div class="topButtons"><button class="topButton" onclick="openPasswordScreen()">좌우명 추가 또는 수정하기</button><button class="topButton" id="fullscreenButton" onclick="toggleFullscreen()">전체화면</button></div>
<div class="title">혁성에게 물어보세요</div><div class="subtitle">진리를 알려드릴 테니</div>
<div class="resultBox"><div class="label">REVELATION</div><div id="result">고민이 있다면 질문을 던지십시오.</div></div>
<button class="askButton" id="askButton" onclick="askHyukseong()">혁성에게 좌우명 묻기</button>
<div id="statusMessage"></div>
<div class="timeControl"><label for="timeSlider">응답 시간：<span id="timeValue">5초</span></label><input type="range" id="timeSlider" min="1" max="10" value="5" step="1"><div class="timeDescription" id="timeDescription">기본 응답 시간입니다.</div></div>
<div class="count" id="truthCount"></div></div></section>
<section id="passwordScreen" class="screen"><div class="passwordContainer"><div class="passwordIcon">◆</div><div class="passwordTitle">개발자 인증</div><div class="passwordDescription">좌우명 관리 화면에 접근하려면<br>개발자 비밀번호를 입력하십시오.</div><input type="password" id="developerPassword" placeholder="개발자 비밀번호" autocomplete="off" onkeydown="handlePasswordKey(event)"><button class="passwordButton" onclick="checkDeveloperPassword()">인증하고 들어가기</button><div id="passwordError" class="passwordError">비밀번호가 올바르지 않습니다.</div><button class="backButton" onclick="backToAskFromPassword()">돌아가기</button></div></section>
<section id="manageScreen" class="screen"><div class="manageContainer"><div class="manageTitle">좌우명 관리</div><div class="manageDescription">혁성이 내려줄 진리를 추가하거나 수정하고 삭제할 수 있습니다.</div><div class="addArea"><input type="text" id="newTruth" placeholder="새로운 진리를 입력하십시오." onkeydown="handleNewTruthKey(event)"><button class="addButton" onclick="addTruth()">진리 추가</button></div><div class="truthList" id="truthList"></div><button class="backButton" onclick="backToAsk()">질문 화면으로 돌아가기</button></div></section>
<div class="modal" id="editModal"><div class="modalContent"><div class="modalTitle">진리 수정</div><textarea id="editInput" placeholder="진리를 입력하십시오."></textarea><div class="modalButtons"><button onclick="closeEditModal()">취소</button><button class="save" onclick="saveEditedTruth()">저장</button></div></div></div>
<script>
const defaultSentences = [
  "진정한 테토는 시험 대비를 다 끝내고 시험 직전까지 진도를 나간다",
  "까짓거 해보죠 뭐",
  "도전이 없으면 성공도 없다",
  "괜찮아 안죽어",
  "로쿠데나시 없이는 실패도 성공도 숨쉴자격 또한 없다",
  "과거의 일은 돌아오지 않지만 미래의 일은 다가온다",
  "실패는 있지만 의미없는 경험은 없다",
  "할까말까 고민되면 그냥 해라",
  "어차피 후회할 거 차라리 한다",
  "닥치고 해",
  "쫄?",
  "에겐?",
  "이왕하는거 그냥 질러라",
  "ㅅㅂ 살았죠?",
  "할꺼면 끝까지 해라",
  "과거를 바꿀 수는 없지만 오늘의 나로 내일의 우리를 바꿀 수 있다",
  "내가 건넨 한 마디가 누군가의 세상을 조금 더 따뜻하게 만들 수 있다",
  "얘야, 인생이란 원래 자기 생각대로 되지 않는 법이란다",
  "마냥 자기가 하고 싶은 것만 하는 것이 아니라 해야 할 일들도 게을리 하지 않아야 한다",
  "그대는 운명을 믿소?",
  "상식에 사로잡히지 마",
  "난 물러서는건 질색이야",
  "표현하지 않으면 아무 일도 일어나지 않는다",
  "뭐라도 결말이 있어야, 새로운 에피소드가 시작될 수 있다",
  "내가 틀릴 수도 있다",
  "결말이 어떻든 뭐 어때 그게 내가 앞으로 나아갈 발판인데",
  "실패의 고통보다 후회의 고통이 더 크다",
  "덤벼",
  "버텨",
  "남자가 한번 뱉은 말은 지켜야지",
  "너의 인생이 그정도 수준이면 그대로 있어 근데 아니면 움직여",
  "목표를 잡았으면 그 목표를 조져야지",
  "멀뚱 멀뚱히 가만히 쳐 있지만 말고 문제에 태클을 걸어!",
  "니 쪼대로 인생 살거면 차라리 나한테 ㅆㄴ이라고 하지 그래?",
  "이것도 못 버티는데 어떻게 살아있냐?",
  "see far 씨팔
    (멀리 봐라)", 
  "가만히 있으면 너넨 드라마 엑스트라 n번으로 남는거야",
  "힘내라",
  "꼬우면 재벌집 자녀되든지 아니면 쌔가빠지게 노력하고",
  "여기 일짱 누구야!!"
];
const DEVELOPER_PASSWORD="12341234sd@";
const DATA_VERSION="100_truths_v2";
if(localStorage.getItem("hyukseongTruthVersion")!==DATA_VERSION){localStorage.setItem("hyukseongSentences",JSON.stringify(defaultSentences));localStorage.setItem("hyukseongTruthVersion",DATA_VERSION)}
let sentences=JSON.parse(localStorage.getItem("hyukseongSentences"))||[...defaultSentences];
let isAsking=false,editingIndex=-1,responseTime=5;
let recentMottos=[];

function getNextMotto(){
  if(!sentences.length) return "";
  const available=sentences.map((_,i)=>i).filter(i=>!recentMottos.includes(i));
  const pool=available.length ? available : sentences.map((_,i)=>i);
  const index=pool[Math.floor(Math.random()*pool.length)];
  recentMottos.push(index);
  if(recentMottos.length>5) recentMottos.shift();
  return sentences[index];
}
const timeSlider=document.getElementById("timeSlider"),timeValue=document.getElementById("timeValue"),timeDescription=document.getElementById("timeDescription");
timeSlider.addEventListener("input",()=>{responseTime=Number(timeSlider.value);timeValue.textContent=responseTime+"초";timeDescription.textContent=responseTime<=3?"짧은 시간 동안 빠르게 응답합니다.":responseTime<=6?"혁성이 잠시 생각한 뒤 응답합니다.":responseTime<=8?"혁성이 조금 더 오래 숙고한 뒤 응답합니다.":"혁성이 충분히 숙고한 뒤 응답합니다."});
function saveSentences(){localStorage.setItem("hyukseongSentences",JSON.stringify(sentences))}
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active")}
function backToAsk(){showScreen("askScreen")}
function openPasswordScreen(){showScreen("passwordScreen");developerPassword.value="";passwordError.classList.remove("active");setTimeout(()=>developerPassword.focus(),100)}
function backToAskFromPassword(){showScreen("askScreen")}
function checkDeveloperPassword(){if(developerPassword.value===DEVELOPER_PASSWORD){passwordError.classList.remove("active");developerPassword.value="";showScreen("manageScreen");renderTruths()}else{passwordError.classList.add("active");developerPassword.value="";developerPassword.focus()}}
function handlePasswordKey(e){if(e.key==="Enter")checkDeveloperPassword()}
function handleNewTruthKey(e){if(e.key==="Enter")addTruth()}
function renderTruths(){truthList.innerHTML="";sentences.forEach((truth,i)=>{const item=document.createElement("div");item.className="truthItem";item.innerHTML='<div class="truthNumber">'+(i+1)+'</div><div class="truthText"></div><button class="editButton">수정</button><button class="deleteButton">삭제</button>';item.querySelector(".truthText").textContent=truth;item.querySelector(".editButton").onclick=()=>openEditModal(i);item.querySelector(".deleteButton").onclick=()=>deleteTruth(i);truthList.appendChild(item)});updateCount()}
function addTruth(){const v=newTruth.value.trim();if(!v)return;sentences.push(v);recentMottos=[];saveSentences();newTruth.value="";renderTruths()}
function deleteTruth(i){if(confirm("이 진리를 삭제하시겠습니까?")){sentences.splice(i,1);saveSentences();renderTruths()}}
function openEditModal(i){editingIndex=i;editInput.value=sentences[i];editModal.classList.add("active");editInput.focus()}
function closeEditModal(){editingIndex=-1;editModal.classList.remove("active")}
function saveEditedTruth(){const v=editInput.value.trim();if(editingIndex===-1||!v)return;sentences[editingIndex]=v;recentMottos=[];saveSentences();closeEditModal();renderTruths()}
function updateCount(){truthCount.textContent="현재 "+sentences.length+"개의 진리가 준비되어 있습니다."}
function askHyukseong(){if(isAsking)return;if(!sentences.length){result.textContent="등록된 좌우명이 없습니다.";return}isAsking=true;const total=responseTime*1000;mainContainer.classList.add("asking");askButton.disabled=true;askButton.textContent="혁성이 응답하고 있습니다";result.classList.remove("revealed");result.classList.add("waiting");result.textContent="혁성에게 묻는 중";statusMessage.classList.add("active");statusMessage.textContent="좌우명을 탐색하고 있습니다";setTimeout(()=>{result.textContent="응답을 준비하고 있습니다";statusMessage.textContent="응답이 내려옵니다"},total*.27);setTimeout(()=>{result.textContent="잠시 기다리십시오";statusMessage.textContent="혁성의 뜻을 기다리는 중"},total*.53);setTimeout(()=>{result.textContent="좌우명이 결정되었습니다";statusMessage.textContent="REVELATION"},total*.77);setTimeout(()=>{result.classList.remove("waiting");result.classList.add("revealed");result.textContent=getNextMotto();mainContainer.classList.remove("asking");askButton.disabled=false;askButton.textContent="혁성에게 좌우명 묻기";statusMessage.classList.remove("active");isAsking=false},total)}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{})}
document.addEventListener("fullscreenchange",()=>fullscreenButton.textContent=document.fullscreenElement?"전체화면 종료":"전체화면");
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&editModal.classList.contains("active"))closeEditModal()});
updateCount();
</script>
</body>
</html>
